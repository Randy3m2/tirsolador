name: Cancel superseded validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded 1.0.1 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/Randy3m2/tirsolador/actions/runs/42559233714/cancel || true
