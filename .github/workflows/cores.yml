name: Native console cores
on:
  push:
    branches: [main]
    paths: ['config/cores.json','tools/build_cores.py','tools/fetch_cores.py','.github/workflows/cores.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: python tools/fetch_cores.py
      - run: python tools/build_cores.py '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cores-${{ matrix.abi }}
          path: native-dist/${{ matrix.abi }}/
  publish:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native-dist
      - run: python tools/fetch_cores.py
      - name: Package corresponding sources and binaries
        run: |
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            (cd "native-dist/cores-$ABI" && zip -q "../../dist/cores-$ABI.zip" ./*.so cores.json)
          done
          tar --exclude='.git' -czf dist/core-sources.tar.gz vendor config/cores.json tools/build_cores.py tools/fetch_cores.py
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish source-built core assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c 'import json;print(json.load(open("config/cores.json"))["release"])')
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title 'Núcleos nativos · Fuentes y binarios' --notes 'Compilados desde las revisiones fijadas en config/cores.json. Incluye fuentes correspondientes y licencias originales. No contiene ROMs ni BIOS propietarias.'
          fi
          gh release upload "$TAG" dist/* --clobber
