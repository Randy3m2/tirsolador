name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare pinned melonDS core
        run: bash tools/prepare_core.sh
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tirsolador-preview-key-v2
      - name: Prepare preview signing key at the configured path
        run: bash tools/prepare_preview_key.sh
      - name: Build and lint
        env:
          TIRSO_TELEGRAM_API_HASH: ${{ secrets.TIRSO_TELEGRAM_API_HASH }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Package APK
        env:
          TIRSO_TELEGRAM_API_HASH: ${{ secrets.TIRSO_TELEGRAM_API_HASH }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Tirsolador-v0.4.0-preview.apk
          mkdir -p source
          git archive HEAD | tar -x -C source
          mkdir -p source/app/src/main/cpp/upstream
          git -C app/src/main/cpp/upstream archive HEAD | tar -x -C source/app/src/main/cpp/upstream
          tar -czf dist/Tirsolador-v0.4.0-source.tar.gz -C source .
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          if [ -n "$TIRSO_TELEGRAM_API_HASH" ]; then
            printf 'Telegram credentials: supplied by CI secret. Account authorization still requires QR.\n' > dist/BUILD_STATUS.txt
          else
            printf 'Telegram credentials: configure API hash once on the device, or supply TIRSO_TELEGRAM_API_HASH in GitHub Actions secrets and rebuild.\n' > dist/BUILD_STATUS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tirsolador-v0.4.0-preview
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --prerelease --title "Tirsolador 0.4.0 · Nintendo DS integrado" --notes-file docs/BUILD_4.md
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare native core and own diagnostic ROM
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          bash tools/prepare_core.sh
          python tools/make_test_rom.py app/src/androidTest/assets/diagnostic.nds
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash tools/test_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-build-4
          path: screenshots/
