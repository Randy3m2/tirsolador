name: Verify built release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-existing.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  upgrade-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify provenance of already tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Randy3m2/tirsolador/actions/runs/42447776353 --jq .head_sha)" = 1ad1f45b1484af1315a8de009d58b7a6873bc492
          gh api repos/Randy3m2/tirsolador/actions/runs/42447776353/jobs --jq 'any(.jobs[]; .name == "build" and .conclusion == "success")' | grep -qx true
          gh api repos/Randy3m2/tirsolador/actions/runs/42447776353/jobs --jq 'any(.jobs[]; .name == "smoke-test" and .conclusion == "success")' | grep -qx true
      - uses: actions/download-artifact@v4
        with:
          name: Tirsolador-v1.0.0
          path: dist
          github-token: ${{ github.token }}
          run-id: 42447776353
      - name: Require successful update installation and data preservation test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Randy3m2/tirsolador/actions/runs/42448558287/jobs --jq 'any(.jobs[].steps[]; .name == "Run reactivecircus/android-emulator-runner@v2" and .conclusion == "success")' | grep -qx true
      - name: Verify APK integrity and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c dist/SHA256SUMS.txt
          gh release create v1.0.0 dist/* --target "$GITHUB_SHA" --title 'Tirsolador 1.0.0 · nueve consolas integradas' --notes-file docs/BUILD_1_0.md
